<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f6f3">
  <title>Управление сайтом — Alisa Miterova</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div id="login" class="login-screen is-hidden">
    <main class="lg-card">
      <svg class="lg-logo" fill="currentColor" height="44" viewBox="0 0 40 48" width="37" aria-hidden="true"><clipPath id="lgclip"><path d="m0 0h40v48h-40z"/></clipPath><g clip-path="url(#lgclip)"><path d="m25.0887 5.05386-3.933-1.05386-3.3145 12.3696-2.9923-11.16736-3.9331 1.05386 3.233 12.0655-8.05262-8.0526-2.87919 2.8792 8.83271 8.8328-10.99975-2.9474-1.05385625 3.933 12.01860625 3.2204c-.1376-.5935-.2104-1.2119-.2104-1.8473 0-4.4976 3.646-8.1436 8.1437-8.1436 4.4976 0 8.1436 3.646 8.1436 8.1436 0 .6313-.0719 1.2459-.2078 1.8359l10.9227 2.9267 1.0538-3.933-12.0664-3.2332 11.0005-2.9476-1.0539-3.933-12.0659 3.233 8.0526-8.0526-2.8792-2.87916-8.7102 8.71026z"/><path d="m27.8723 26.2214c-.3372 1.4256-1.0491 2.7063-2.0259 3.7324l7.913 7.9131 2.8792-2.8792z"/><path d="m25.7665 30.0366c-.9886 1.0097-2.2379 1.7632-3.6389 2.1515l2.8794 10.746 3.933-1.0539z"/><path d="m21.9807 32.2274c-.65.1671-1.3313.2559-2.0334.2559-.7522 0-1.4806-.102-2.1721-.2929l-2.882 10.7558 3.933 1.0538z"/><path d="m17.6361 32.1507c-1.3796-.4076-2.6067-1.1707-3.5751-2.1833l-7.9325 7.9325 2.87919 2.8792z"/><path d="m13.9956 29.8973c-.9518-1.019-1.6451-2.2826-1.9751-3.6862l-10.95836 2.9363 1.05385 3.933z"/></g></svg>
      <h1 class="lg-h">С возвращением</h1>
      <p class="lg-sub">Alisa Miterova — панель управления</p>
      <form id="loginForm" class="lg-form">
        <label class="sr-only" for="loginName">Логин</label>
        <input id="loginName" autocomplete="username" placeholder="Логин" required>
        <label class="sr-only" for="loginPassword">Пароль</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Пароль" required>
        <button class="lg-btn" type="submit">Войти</button>
      </form>
      <p id="loginError" class="lg-err" role="alert"></p>
    </main>
  </div>

  <div id="adminApp" class="app-shell is-hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="mark" aria-hidden="true">AM</span>
        <span><b>Alisa Miterova</b><small>Управление сайтом</small></span>
      </div>
      <nav id="mainNav" class="nav" aria-label="Разделы админ-панели"></nav>
      <div class="sidebar-foot">
        <button id="magicLink" class="text-button" type="button">Ссылка для входа</button>
        <button id="logout" class="text-button" type="button">Выйти</button>
      </div>
    </aside>

    <header class="mobile-head">
      <button id="menuToggle" class="icon-button" type="button" aria-label="Открыть меню" aria-expanded="false"><i></i><i></i></button>
      <span class="mark">AM</span>
      <button class="icon-button preview-shortcut" type="button" data-preview aria-label="Открыть предпросмотр"><span class="eye-icon"></span></button>
    </header>

    <main class="workspace">
      <header class="workspace-head">
        <div>
          <p id="sectionKicker" class="eyebrow"></p>
          <h1 id="sectionTitle"></h1>
          <p id="sectionNote" class="section-note"></p>
        </div>
        <div class="head-actions">
          <span id="draftState" class="draft-state">Все изменения сохранены</span>
          <button class="button button-light" type="button" data-preview><span class="eye-icon"></span> Предпросмотр</button>
          <button id="publish" class="button button-dark" type="button">Опубликовать</button>
        </div>
      </header>
      <section id="editor" class="editor" aria-live="polite"></section>
    </main>
  </div>

  <div id="previewModal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <div class="modal-panel">
      <header class="modal-head">
        <div>
          <p class="eyebrow">До публикации</p>
          <h2 id="previewTitle">Предпросмотр</h2>
        </div>
        <div class="preview-actions">
          <div class="device-switch" role="group" aria-label="Размер экрана">
            <button type="button" data-device="desktop" class="is-active">Компьютер</button>
            <button type="button" data-device="mobile">Телефон</button>
          </div>
          <button id="closePreview" class="icon-button close-button" type="button" aria-label="Закрыть"></button>
        </div>
      </header>
      <div class="preview-stage">
        <div id="previewFrame" class="preview-frame desktop"></div>
      </div>
      <footer class="modal-foot">
        <p>Так раздел будет выглядеть после публикации.</p>
        <button id="publishFromPreview" class="button button-dark" type="button">Всё хорошо — опубликовать</button>
      </footer>
    </div>
  </div>

  <div id="confirmModal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-card">
      <p class="eyebrow">Последняя проверка</p>
      <h2 id="confirmTitle">Опубликовать изменения?</h2>
      <p>Новые фотографии и тексты станут доступны на сайте.</p>
      <div class="confirm-actions">
        <button id="cancelPublish" class="button button-light" type="button">Ещё проверить</button>
        <button id="confirmPublish" class="button button-dark" type="button">Опубликовать</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="filePicker" type="file" hidden>
  <script src="/admin.js"></script>
</body>
</html>
